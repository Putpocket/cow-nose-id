<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소 비문 식별 | Cattle System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
  <script src="{{ url_for('static', filename='js/index.js') }}" defer></script>
</head>
<body>
  <header>
    <div class="logo">Cattle System</div>
    <div class="header-title">소 비문 식별</div>
    <div class="user-info">
      <span id="currentUser">확인 중</span>
      <div class="menu">
        <input type="checkbox" id="menu-toggle">
        <label for="menu-toggle" class="menu-icon">메뉴</label>
        <div class="sidebar">
          <p id="sidebarUser" class="sidebar-user">확인 중</p>
          <a href="/">식별</a>
          <a href="/admin" id="adminLink" hidden>관리자</a>
          <button type="button" id="logoutButton">로그아웃</button>
        </div>
      </div>
    </div>
  </header>

  <main class="main-content user-main">
    <section class="upload-card">
      <div class="section-heading">
        <h2>이미지 업로드</h2>
        <p>소 코 사진을 업로드하면 백엔드 식별 API 결과를 표시합니다.</p>
      </div>
      <form id="identifyForm" enctype="multipart/form-data">
        <label for="file">이미지 선택</label>
        <input type="file" id="file" name="file" accept="image/jpeg,image/png,image/webp" required>
        <button type="submit">식별 시작</button>
      </form>
      <p id="uploadMessage" class="form-message" role="status"></p>
    </section>

    <section class="result-card" id="resultPanel">
      <h2>식별 결과</h2>
      <div id="identifyResult" class="empty-state">아직 식별 결과가 없습니다.</div>
    </section>

    <section class="history-board">
      <div class="section-heading">
        <h2>최근 조회 이력</h2>
        <p>조회 이력 API가 연결되면 본인 식별 요청 기록이 표시됩니다.</p>
      </div>
      <div id="historyList" class="history-list empty-state">최근 조회 이력이 없습니다.</div>
    </section>
  </main>
</body>
</html>
